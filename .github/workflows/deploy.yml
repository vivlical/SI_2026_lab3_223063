name: Deploy

on:
  push:
    branches: [ master, feature ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/si-2026-lab3:master-latest .

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/si-2026-lab3:master-latest